name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ১. প্রজেক্ট বিল্ড করা
      - name: Install Dependencies and Build Web Project
        run: |
          npm install
          npm run build || node build.js

      # ২. অ্যান্ড্রয়েড প্রজেক্ট ইনিশিয়ালাইজ করা
      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/status-bar
          npx cap init "Flashgram" "com.sohel.flashgram" --web-dir "dist"
          npx cap add android

      # ৩. ফুল স্ক্রিন মোড ও প্রতিটি পারমিশন স্বয়ংক্রিয়ভাবে অন করা
      - name: Configure Fullscreen & All Android Permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # ক্যামেরা, মাইক, অডিও, গ্যালারি ও ইন্টারনেটের সব পারমিশন
          PERMISSIONS="
              <uses-permission android:name=\"android.permission.INTERNET\" />
              <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />
              <uses-permission android:name=\"android.permission.CAMERA\" />
              <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />
              <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />
              <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_IMAGES\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_VIDEO\" />
              <uses-permission android:name=\"android.permission.READ_MEDIA_AUDIO\" />
              <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />
              <uses-feature android:name=\"android.hardware.microphone\" android:required=\"false\" />"

          sed -i "/<manifest/a $PERMISSIONS" $MANIFEST

          # ফুল স্ক্রিন মোড (NoActionBar / Immersive Display) চালু করা
          STYLES="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES" ]; then
            sed -i 's/Theme.AppCompat.Light.DarkActionBar/Theme.AppCompat.Light.NoActionBar/g' $STYLES
            sed -i '/<resources>/a <style name=\"AppTheme.NoActionBarFullScreen\" parent=\"Theme.AppCompat.Light.NoActionBar\"><item name=\"android:windowFullscreen\">true</item><item name=\"android:windowContentOverlay\">@null</item></style>' $STYLES
          fi

          npx cap sync android

      # ৪. APK বিল্ড করা
      - name: Build APK via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # ৫. তৈরি হওয়া APK ফাইলটি ডাউনলোডের জন্য সেভ করা
      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: Flashgram-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
